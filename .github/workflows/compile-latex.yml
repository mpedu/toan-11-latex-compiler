name: Compile LaTeX to PDF

on:
  push:
    paths:
      - 'inputs/*.tex'
  workflow_dispatch:

# Cấp quyền Ghi bắt buộc để tránh lỗi Exit code 128 khi git push
permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: inputs/*.tex
          args: "-interaction=nonstopmode -file-line-error -pdf"

      - name: Send compiled PDFs back to Google Drive
        if: env.DRIVE_WEBHOOK_URL != ''
        env:
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
        run: |
          for pdf in inputs/*.pdf; do
            if [ -f "$pdf" ]; then
              filename=$(basename "$pdf")
              echo "Đang gửi $filename về Google Drive..."
              base64_data=$(base64 -w 0 "$pdf")
              
              curl -L -X POST "$DRIVE_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d "{\"file_name\":\"$filename\", \"file_base64\":\"$base64_data\"}"
            fi
          done

      - name: Move generated PDFs to outputs folder
        run: |
          mkdir -p outputs
          mv inputs/*.pdf outputs/ || true

      - name: Commit and Push PDFs to GitHub Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/*.pdf
          git commit -m "Auto-compiled and synced PDF: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
