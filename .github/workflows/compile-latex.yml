name: Compile LaTeX to PDF

on:
  push:
    paths:
      - 'inputs/*.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - name: Install System Utilities
        run: |
          apt-get update && apt-get install -y curl git ca-certificates

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile All TeX Files to PDF
        run: |
          mkdir -p outputs
          for tex in inputs/*.tex; do
            if [ -f "$tex" ]; then
              echo "--- Đang biên dịch: $tex ---"
              pdflatex -interaction=nonstopmode -shell-escape -output-directory=outputs "$tex" || true
              pdflatex -interaction=nonstopmode -shell-escape -output-directory=outputs "$tex" || true
            fi
          done
          ls -la outputs/

      - name: Send compiled PDFs back to Google Drive
        env:
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
        run: |
          if [ -n "$DRIVE_WEBHOOK_URL" ]; then
            for pdf in outputs/*.pdf; do
              if [ -f "$pdf" ]; then
                filename=$(basename "$pdf")
                echo "Đang gửi $filename về Google Drive..."
                base64_data=$(base64 -w 0 "$pdf")
                curl -L -X POST "$DRIVE_WEBHOOK_URL" \
                  -H "Content-Type: application/json" \
                  -d "{\"file_name\":\"$filename\", \"file_base64\":\"$base64_data\"}"
              fi
            done
          else
            echo "Bỏ qua gửi Drive: Chưa cấu hình Secret DRIVE_WEBHOOK_URL."
          fi

      - name: Commit and Push PDFs to GitHub Repo
        run: |
          git config --global --add safe.directory /__w/toan-11-latex-compiler/toan-11-latex-compiler
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/*.pdf
          if git diff --cached --quiet; then
            echo "Không có file PDF mới để commit."
          else
            git commit -m "Auto-compiled and synced PDF: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
