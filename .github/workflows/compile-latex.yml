name: Compile LaTeX to PDF

on:
  push:
    paths:
      - 'inputs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install System Utilities
        run: |
          apt-get update && apt-get install -y curl git ca-certificates bash

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile All TeX Files to PDF
        run: |
          mkdir -p outputs
          for tex in inputs/*.tex; do
            [ -e "$tex" ] || continue
            echo "=== DANG BIEN DICH: $tex ==="
            pdflatex -interaction=nonstopmode -shell-escape -output-directory=outputs "$tex" || true
            pdflatex -interaction=nonstopmode -shell-escape -output-directory=outputs "$tex" || true
          done
          echo "=== DANH SACH FILE TRONG OUTPUTS ==="
          ls -la outputs/

      - name: Send compiled PDFs back to Google Drive
        env:
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
        run: |
          if [ -n "$DRIVE_WEBHOOK_URL" ]; then
            for pdf in outputs/*.pdf; do
              [ -e "$pdf" ] || continue
              filename=$(basename "$pdf")
              echo "Dang gui $filename ve Google Drive..."
              base64_data=$(base64 -w 0 "$pdf")
              response=$(curl -s -L -X POST "$DRIVE_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d "{\"file_name\":\"$filename\", \"file_base64\":\"$base64_data\"}")
              echo "Phan hoi tu Google Drive: $response"
            done
          else
            echo "Chua cau hinh DRIVE_WEBHOOK_URL, bo qua buoc gui Drive."
          fi

      - name: Commit and Push PDFs to GitHub Repo
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/*.pdf 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Khong co file PDF moi de commit."
          else
            git commit -m "Auto-compiled PDF: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
